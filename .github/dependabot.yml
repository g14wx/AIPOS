# Dependabot: alertas de seguridad para los paquetes npm del repositorio.
# La prueba técnica exige Vue 2 y Vuetify 2, que ya no reciben arreglos, así
# que sus alertas se revisan a mano. Los PR de seguridad automáticos están
# apagados en la configuración de seguridad del repositorio: proponían pasar a
# Vue 3 y Vuetify 3, que rompen la app, y este archivo no alcanzó a frenarlos.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    # 0 apaga los PR de versiones normales.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuetify"
        update-types: ["version-update:semver-major"]
