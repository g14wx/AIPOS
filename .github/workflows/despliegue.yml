# Pipeline de despliegue de AIPOS. Spec: specs/despliegue.spec.md, sección "El workflow".
# Arranca solo cuando la persona desarrolladora sube una etiqueta release-MAYOR.MENOR.PARCHE. Los cinco jobs van uno
# detrás de otro; si uno falla, los siguientes no corren. GitHub corre el workflow que está en el commit de la etiqueta,
# así que este archivo tiene que estar en ProductionEnv antes de subir la primera.
name: Despliegue

on:
  push:
    tags: ['release-*']

permissions:
  contents: read

# Dos etiquetas seguidas se ponen en fila: no se cancelan ni se pisan.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  revisar:
    name: Revisar la etiqueta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: La etiqueta tiene la forma release-X.Y.Z y su commit está en ProductionEnv
        run: bash despliegue/revisar-etiqueta.sh "$GITHUB_REF_NAME"

  probar-backend:
    name: Probar el backend
    needs: revisar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-clave-de-prueba
          MYSQL_DATABASE: aipos
          MYSQL_USER: aipos
          MYSQL_PASSWORD: ci-clave-de-prueba
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: aipos
      MYSQL_TEST_DATABASE: aipos_prueba
      MYSQL_USER: aipos
      MYSQL_PASSWORD: ci-clave-de-prueba
      MYSQL_ROOT_PASSWORD: ci-clave-de-prueba
      CORS_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run preparar-prueba
      - run: npm test

  probar-frontend:
    name: Probar la pantalla
    needs: revisar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  construir:
    name: Construir las imágenes
    needs: [probar-backend, probar-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y subir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/g14wx/aipos-backend:${{ github.ref_name }}
      - name: Construir y subir la imagen de la pantalla
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=https://aipos-back.salsalvador.io
          tags: ghcr.io/g14wx/aipos-frontend:${{ github.ref_name }}

# El job desplegar sigue en el mismo archivo.
