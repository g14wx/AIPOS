# Documentación de la API de AIPOS: el documento OpenAPI 3 es la única fuente de lo que dice la documentación.
# Se muestra con Swagger UI en GET /api/docs. Cada tarjeta que crea una ruta agrega aquí su entrada y su router
# a `montajes` (src/routes/index.js): si falta una de las dos cosas, `npm test` falla.
openapi: 3.0.3
info:
  title: API de AIPOS
  version: '1.0.0'
  description: |
    AIPOS es un punto de venta de una sola pantalla: el cajero busca productos, arma la venta actual y la registra.
    Esta es la documentación de la API del backend: cada ruta, lo que recibe, lo que responde y su formato de error.

    - No hay login: quien tiene la pantalla abierta es el cajero.
    - El dinero va como texto con 2 decimales, por ejemplo `"25.00"`, para no perder centavos.
    - Toda respuesta de error tiene el mismo formato: `{ "error": { "codigo", "mensaje", "detalles" } }`.
servers:
  # Una dirección relativa: "Try it out" llama al mismo servidor que mostró esta página, sea localhost o producción.
  - url: /
tags:
  # Una etiqueta por recurso en uso. Las de Productos y Ventas las agregan las tarjetas que crean esas rutas.
  - name: Salud
    description: Revisar que la API está viva.
  - name: Productos
    description: Los productos que se venden en la tienda, con su nombre, su precio y su código de barras.
paths:
  /api/productos:
    post:
      operationId: crearProducto
      tags:
        - Productos
      summary: Crear un producto
      description: |
        Guarda un producto nuevo. La API revisa todos los datos antes de guardar y, si algún campo no sirve,
        responde 400 con un elemento en `detalles` por cada campo con problema, en el orden `nombre`, `precio` y
        `codigoBarras`.

        - El `precio` viaja como texto, por ejemplo `"25.50"`: un número JSON (`25.5`) es un 400. Tiene que ser mayor
          que 0, con 2 decimales como máximo y hasta `99999.99`.
        - El `nombre` y el `codigoBarras` se guardan sin los espacios de los extremos. Un texto que solo tenía espacios
          es un 400. El largo se cuenta en caracteres: un emoji cuenta 1.
        - El código de barras es único. Si ya existe, responde 409 y el producto que ya estaba no cambia. Sale del
          índice único de la base de datos, así que dos peticiones iguales al mismo tiempo crean un solo producto.
        - Los campos que sobran (por ejemplo `id`) se ignoran: el `id` lo pone la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoNuevo'
            example:
              nombre: 'Leche entera 1 L'
              precio: '25.00'
              codigoBarras: '7501055300075'
      responses:
        '201':
          description: El producto se creó. El `precio` vuelve con 2 decimales, aunque se mandara `"25"`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              example:
                id: 1
                nombre: 'Leche entera 1 L'
                precio: '25.00'
                codigoBarras: '7501055300075'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/salud:
    get:
      operationId: consultarSalud
      tags:
        - Salud
      summary: Consultar si la API está viva
      description: Sirve para saber si el backend responde. No recibe nada y no cambia nada.
      responses:
        '200':
          description: La API está viva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: 'ok'
                baseDeDatos: 'ok'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  schemas:
    Salud:
      type: object
      description: La respuesta de GET /api/salud.
      required:
        - estado
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: ['ok']
          description: Siempre `ok` cuando la API responde.
        baseDeDatos:
          type: string
          enum: ['ok']
          description: Solo aparece cuando la API comprueba MySQL (tarjeta B-03). Siempre `ok`.
    ProductoNuevo:
      type: object
      description: Los datos para crear un producto. Los campos que sobran se ignoran.
      required:
        - nombre
        - precio
        - codigoBarras
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          description: Cómo se llama el producto. De 1 a 120 caracteres, sin espacios en los extremos.
        precio:
          type: string
          pattern: '^\d{1,5}(\.\d{1,2})?$'
          description: >-
            Lo que cuesta el producto, como texto con punto decimal y hasta 2 decimales, por ejemplo `"25.50"`.
            Mayor que 0 y hasta `99999.99`.
        codigoBarras:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            El número impreso en el producto, como texto para no perder los ceros de la izquierda. De 1 a 50
            caracteres, sin espacios en los extremos. No se puede repetir.
    Producto:
      type: object
      description: Un producto guardado.
      required:
        - id
        - nombre
        - precio
        - codigoBarras
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Lo pone la base de datos.
        nombre:
          type: string
          description: Cómo se llama el producto.
        precio:
          type: string
          pattern: '^\d{1,5}(\.\d{1,2})?$'
          description: Lo que cuesta el producto, como texto con 2 decimales, por ejemplo `"25.00"`.
        codigoBarras:
          type: string
          description: El número impreso en el producto, con sus ceros de la izquierda.
    RespuestaDeError:
      type: object
      description: El formato de error, igual en todas las rutas.
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - codigo
            - mensaje
          additionalProperties: false
          properties:
            codigo:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              description: Texto estable, en mayúsculas y con guion bajo, que la pantalla puede leer.
            mensaje:
              type: string
              description: Una frase en español para el cajero.
            detalles:
              type: array
              description: >-
                Un elemento por campo con problema. Solo lo llevan el 400 y el 409 del código de barras repetido.
              items:
                $ref: '#/components/schemas/DetalleDeError'
    DetalleDeError:
      type: object
      description: Un campo con problema.
      required:
        - campo
        - mensaje
      additionalProperties: false
      properties:
        campo:
          type: string
          description: El nombre del campo del JSON, por ejemplo `precio`.
        mensaje:
          type: string
          description: Qué tiene mal ese campo.
  responses:
    DatosInvalidos:
      description: La forma o los valores de la petición no cumplen las reglas (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDeError'
          example:
            error:
              codigo: 'DATOS_INVALIDOS'
              mensaje: 'El precio no puede tener más de 2 decimales.'
              detalles:
                - campo: 'precio'
                  mensaje: 'No puede tener más de 2 decimales.'
    NoEncontrado:
      description: La ruta no existe, o lo pedido no existe (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDeError'
          example:
            error:
              codigo: 'NO_ENCONTRADO'
              mensaje: 'La ruta no existe.'
    Conflicto:
      description: Un dato único ya existe (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDeError'
          example:
            error:
              codigo: 'CODIGO_BARRAS_DUPLICADO'
              mensaje: 'Ya existe un producto con ese código de barras.'
              detalles:
                - campo: 'codigoBarras'
                  mensaje: 'Ya existe un producto con ese código de barras.'
    ReglaDeNegocio:
      description: El procedimiento almacenado rechazó la petición por una regla del negocio (422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDeError'
          example:
            error:
              codigo: 'VENTA_SIN_DETALLES'
              mensaje: 'La venta no tiene productos. Agrega al menos uno.'
    ErrorInterno:
      description: Cualquier otro error (500). El mensaje es genérico y nunca cuenta qué falló por dentro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaDeError'
          example:
            error:
              codigo: 'ERROR_INTERNO'
              mensaje: 'Ocurrió un error inesperado. Intenta de nuevo.'
