# Configuración de nginx de la pantalla de AIPOS. Spec: specs/despliegue.spec.md, sección "Imagen de la pantalla".
# La imagen la copia a /etc/nginx/conf.d/default.conf. nginx corre como el usuario nginx (sin ser root) y escucha en el
# puerto 8080. No comprime: comprime Caddy (encode). Las cabeceras de seguridad también las pone Caddy.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # La página de entrada nunca se guarda en caché: así una versión nueva se ve al recargar.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Los archivos de assets/ llevan un hash en su nombre, así que nunca cambian: se guardan un año.
    location /assets/ {
        # Sin "always": la cabecera solo va en las respuestas buenas, y un 404 nunca se guarda un año.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Es una sola pantalla, sin vue-router: una ruta que no es un archivo da 404.
    location / {
        try_files $uri =404;
    }
}
